<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the audio slitter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000; color: #fff; font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; padding: 28px 16px;
        }
        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
        h1 { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.02em; text-shadow: 0 0 16px rgba(255,255,255,0.12); margin: 0; }
        .canvas-wrap { width: 100%; position: relative; }
        canvas { width: 100%; height: 160px; display: block; border: 1px solid #222; border-radius: 2px; }
        .controls { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
        label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; min-width: 70px; color: #ccc; }
        input[type="range"] { -webkit-appearance: none; flex: 1; min-width: 70px; height: 4px; background: #333; border-radius: 2px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px rgba(255,255,255,0.5); }
        .number-input { width: 70px; background: #111; border: 1px solid #555; color: #fff; padding: 4px 6px; font-family: inherit; font-size: 0.7rem; text-align: right; border-radius: 4px; outline: none; }
        .number-input:focus { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.3); }
        .stepper-btn { background: #1a1a1a; border: 1px solid #444; color: #ccc; font-family: inherit; font-size: 0.7rem; padding: 2px 6px; cursor: pointer; border-radius: 3px; line-height: 1; transition: all 0.15s; min-width: 26px; text-align: center; }
        .stepper-btn:hover { background: #333; border-color: #fff; color: #fff; }
        .value { font-size: 0.65rem; color: #aaa; min-width: 50px; text-align: right; white-space: nowrap; }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
        .checkbox-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.68rem; color: #ccc; letter-spacing: 0.04em; min-width: auto; }
        .checkbox-group input[type="checkbox"] { accent-color: #ff4444; width: 15px; height: 15px; cursor: pointer; }
        button, .btn { background: #111; border: 1px solid #fff; color: #fff; padding: 7px 14px; font-family: inherit; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.05em; border-radius: 20px; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        button:hover, .btn:hover { background: #fff; color: #000; box-shadow: 0 0 14px rgba(255,255,255,0.25); }
        button.red { border-color: #ff4444; color: #ff4444; }
        button.red:hover { background: #ff4444; color: #000; box-shadow: 0 0 18px rgba(255,68,68,0.5); }
        .mode-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .mode-btns .btn { padding: 4px 10px; font-size: 0.6rem; }
        .mode-btns .btn.active { background: #fff; color: #000; border-color: #fff; }
        .file-input { display: none; }
        .record-icon { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; display: inline-block; box-shadow: 0 0 8px #ff4444; }
        .info { font-size: 0.6rem; color: #555; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>the audio slitter</h1>
        <div class="canvas-wrap">
            <canvas id="visCanvas" width="720" height="160"></canvas>
        </div>
        <div class="controls">
            <div class="row">
                <label>delay</label>

                <button class="stepper-btn delay-fine-dec">‹</button>

                <button class="stepper-btn delay-coarse-inc">»</button>

            </div>
            <div class="row">
                <label>buffer</label>
                <input type="range" id="bufferSlider" min="0.02" max="4999" value="50" step="0.1">
                <input type="number" class="number-input" id="bufferNum" value="50" step="0.1" min="0.02" max="4999">
                <button class="stepper-btn buffer-fine-dec">‹</button>
                <button class="stepper-btn buffer-fine-inc">›</button>
                <button class="stepper-btn buffer-coarse-dec">«</button>

            <div class="row">

                <input type="number" class="number-input" id="divisorNum" value="1" step="1" min="1" max="64">
                <button class="stepper-btn divisor-fine-dec">‹</button>
                <button class="stepper-btn divisor-fine-inc">›</button>
                <button class="stepper-btn divisor-coarse-dec">«</button>

            <div class="row">

            <div class="row">

                <button class="stepper-btn simplify-fine-dec">‹</button>

                </div>
            </div>
            <div class="row">
                <label>zoom</label>
                <input type="range" id="zoomSlider" min="0.05" max="10000" value="200" step="0.1">
                <input type="number" class="number-input" id="zoomNum" value="200" step="1" min="0.05" max="10000">
                <button class="stepper-btn zoom-fine-dec">‹</button>
                <button class="stepper-btn zoom-fine-inc">›</button>
                <button class="stepper-btn zoom-coarse-dec">«</button>
                <button class="stepper-btn zoom-coarse-inc">»</button>
                <span class="value" id="zoomVal">200 ms</span>
            </div>
            <div class="row">
                <label>pts Δ</label>
                <input type="range" id="ptsDeltaSlider" min="0.001" max="1" value="0.02" step="0.001">
                <input type="number" class="number-input" id="ptsDeltaNum" value="0.02" step="0.001" min="0.001" max="1">
                <button class="stepper-btn pts-fine-dec">‹</button>
                <button class="stepper-btn pts-fine-inc">›</button>
                <span class="value" id="ptsDeltaVal">0.020</span>
            </div>
            <div class="row" id="barsRow" style="display:none;">
                <label>bars</label>
                <input type="range" id="barsSlider" min="4" max="128" value="32" step="1">
                <input type="number" class="number-input" id="barsNum" value="32" step="1" min="4" max="128">
                <button class="stepper-btn bars-fine-dec">‹</button>
                <button class="stepper-btn bars-fine-inc">›</button>
                <span class="value" id="barsVal">32</span>
            </div>
            <div class="row" style="justify-content:space-between;">
                <span style="font-size:0.65rem;color:#aaa;">mode</span>
                <div class="mode-btns" id="modeBtns">
                    <button class="btn active" data-mode="wave">wave</button>
                    <button class="btn" data-mode="points">points</button>
                    <button class="btn" data-mode="bars">bars</button>
                    <button class="btn" data-mode="diagram">diagram</button>
                    <button class="btn" data-mode="combined">comb.</button>
                    <button class="btn" data-mode="fft">FFT</button>
                </div>
                <label style="min-width:auto;margin-left:10px;"><input type="checkbox" id="stereoVisCheck"> stereo vis</label>
            </div>
            <div class="row" style="justify-content:center;gap:10px;">
                <button id="startBtn" class="red">▶ start</button>
                <button id="sweepBtn">sweep tone</button>
                <button id="micBtn">mic</button>
                <button id="fileBtn">upload file</button>
                <input type="file" id="fileInput" class="file-input" accept="audio/*">
                <button id="recordBtn"><span class="record-icon"></span> rec</button>
            </div>
        </div>
        <div class="info">drag & drop audio · space start/stop · S sweep · M mic · F file</div>
    </div>

    <script>
        (() => {
            // DOM refs...
            const visCanvas = document.getElementById('visCanvas');
            const ctx = visCanvas.getContext('2d');
            const delaySlider = document.getElementById('delaySlider');
            const delayNum = document.getElementById('delayNum');
            const delayVal = document.getElementById('delayVal');
            const bufferSlider = document.getElementById('bufferSlider');
            const bufferNum = document.getElementById('bufferNum');
            const bufferVal = document.getElementById('bufferVal');
            const divisorSlider = document.getElementById('divisorSlider');
            const divisorNum = document.getElementById('divisorNum');
            const divisorVal = document.getElementById('divisorVal');
            const multiplierSlider = document.getElementById('multiplierSlider');
            const multiplierNum = document.getElementById('multiplierNum');
            const multiplierVal = document.getElementById('multiplierVal');
            const bitSlider = document.getElementById('bitSlider');
            const bitNum = document.getElementById('bitNum');
            const bitVal = document.getElementById('bitVal');
            const smoothSlider = document.getElementById('smoothSlider');
            const smoothNum = document.getElementById('smoothNum');
            const smoothVal = document.getElementById('smoothVal');
            const simplifySlider = document.getElementById('simplifySlider');
            const simplifyNum = document.getElementById('simplifyNum');
            const simplifyVal = document.getElementById('simplifyVal');
            const zoomSlider = document.getElementById('zoomSlider');
            const zoomNum = document.getElementById('zoomNum');
            const zoomVal = document.getElementById('zoomVal');
            const ptsDeltaSlider = document.getElementById('ptsDeltaSlider');
            const ptsDeltaNum = document.getElementById('ptsDeltaNum');
            const ptsDeltaVal = document.getElementById('ptsDeltaVal');
            const barsSlider = document.getElementById('barsSlider');
            const barsNum = document.getElementById('barsNum');
            const barsVal = document.getElementById('barsVal');
            const barsRow = document.getElementById('barsRow');
            const nsThreshSlider = document.getElementById('nsThreshSlider');
            const nsThreshVal = document.getElementById('nsThreshVal');
            const rgbaDistortSlider = document.getElementById('rgbaDistortSlider');
            const rgbaDistortVal = document.getElementById('rgbaDistortVal');
            const aecCheck = document.getElementById('aecCheck');
            const ecCheck = document.getElementById('ecCheck');
            const nsCheck = document.getElementById('nsCheck');
            const rgbaDistortCheck = document.getElementById('rgbaDistortCheck');
            const stereoVisCheck = document.getElementById('stereoVisCheck');
            const startBtn = document.getElementById('startBtn');
            const sweepBtn = document.getElementById('sweepBtn');
            const micBtn = document.getElementById('micBtn');
            const fileBtn = document.getElementById('fileBtn');
            const fileInput = document.getElementById('fileInput');
            const recordBtn = document.getElementById('recordBtn');
            const modeBtns = document.getElementById('modeBtns');

            let audioCtx = null;
            let sourceNode = null;
            let workletNode = null;
            let analyserL = null, analyserR = null;
            let isPlaying = false;
            let micStream = null;
            let sweepBuffer = null;
            let workletLoaded = false;
            const MAX_BUFFER_SEC = 12;
            let visSampleRate = 44100;
            let visBufferL = null, visBufferR = null;
            let visWriteIdx = 0, bufferCapacity = 0;
            let recording = false, recordedChunks = [];
            let delayMs = 200, bufferMs = 50;
            let divisorValParam = 1, multiplierValParam = 1.0;
            let bitDepth = 32, smoothPct = 0, simplifyPct = 0;
            let zoomMs = 200, ptsDelta = 0.02;
            let nsThreshPct = 15, aecOn = false, ecOn = false, nsOn = false;
            let rgbaDistortOn = false, rgbaDistortAmt = 30;
            let stereoVis = false;
            let displayMode = 'wave', barsCount = 32;

            const workletCode = `
                class SlitScanLooper extends AudioWorkletProcessor {
                    static get parameterDescriptors() {
                        return [
                            { name: 'holdSamples',   defaultValue: 8820, minValue: 1,   maxValue: 192000, automationRate: 'k-rate' },
                            { name: 'grainSamples',  defaultValue: 2205, minValue: 1,   maxValue: 48000,  automationRate: 'k-rate' },
                            { name: 'aecActive',     defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'ecActive',      defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'nsActive',      defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'nsThreshold',   defaultValue: 0.15,minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'divisor',       defaultValue: 1,   minValue: 1,   maxValue: 64,      automationRate: 'k-rate' },
                            { name: 'multiplier',    defaultValue: 1.0, minValue: 0.1, maxValue: 5.0,     automationRate: 'k-rate' },
                            { name: 'bitDepth',      defaultValue: 32,  minValue: 2,   maxValue: 32,      automationRate: 'k-rate' },
                            { name: 'smoothing',     defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'simplifier',    defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'rgbaDistortOn', defaultValue: 0,   minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                            { name: 'rgbaDistortAmt',defaultValue: 0.3, minValue: 0,   maxValue: 1,       automationRate: 'k-rate' },
                        ];
                    }
                    constructor(opts) {
                        super(opts);
                        const sr = opts.processorOptions?.sampleRate || 44100;
                        this.sr = sr;
                        const maxSamples = Math.ceil(5.5 * sr);
                        this.ringL = new Float32Array(maxSamples + 4096);
                        this.ringR = new Float32Array(maxSamples + 4096);
                        this.ringSize = this.ringL.length;
                        this.writePtr = 0;
                        this.grainL = new Float32Array(48000);
                        this.grainR = new Float32Array(48000);
                        this.grainLen = 0; this.grainRead = 0;
                        this.counter = 0; this.captured = false;
                        this.aecBufLen = Math.ceil(0.12 * sr); this.aecBuf = new Float32Array(this.aecBufLen); this.aecBufPtr = 0; this.aecDelay = Math.ceil(0.06 * sr);
                        this.ecBufLen = Math.ceil(0.3 * sr); this.ecBuf = new Float32Array(this.ecBufLen); this.ecBufPtr = 0; this.ecDelay = Math.ceil(0.18 * sr);
                        this.prevOutL = 0; this.prevOutR = 0;
                        this.simplifyCounter = 0; this.simplifyLastL = 0; this.simplifyLastR = 0;
                        this.divCounter = 0; this.lastOutL = 0; this.lastOutR = 0;
                    }
                    process(inputs, outputs, parameters) {
                        const input = inputs[0];
                        const output = outputs[0];
                        if (!input || !output || input.length < 2) return true;
                        const inL = input[0] || new Float32Array(128);
                        const inR = input[1] || inL;

                        const holdSamples = Math.max(1, Math.round(parameters.holdSamples[0] || 8820));
                        const grainSamples = Math.max(1, Math.round(parameters.grainSamples[0] || 2205));
                        const aecOn = parameters.aecActive[0] >= 0.5;
                        const ecOn = parameters.ecActive[0] >= 0.5;
                        const nsOn = parameters.nsActive[0] >= 0.5;
                        const nsThresh = Math.max(0, Math.min(1, parameters.nsThreshold[0] || 0.15));
                        const divisor = Math.max(1, Math.round(parameters.divisor[0] || 1));
                        const mult = Math.max(0.1, Math.min(5.0, parameters.multiplier[0] || 1.0));
                        const bitDepthVal = Math.max(2, Math.min(32, Math.round(parameters.bitDepth[0] || 32)));
                        const smoothing = Math.max(0, Math.min(1, parameters.smoothing[0] || 0));
                        const simplifier = Math.max(0, Math.min(1, parameters.simplifier[0] || 0));
                        const rgbaOn = parameters.rgbaDistortOn[0] >= 0.5;
                        const rgbaAmt = Math.max(0, Math.min(1, parameters.rgbaDistortAmt[0] || 0.3));

                        const blockSize = output[0].length;
                        for (let i = 0; i < blockSize; i++) {
                            const sampleL = inL[i] || 0;
                            const sampleR = inR[i] || 0;
                            this.ringL[this.writePtr % this.ringSize] = sampleL;
                            this.ringR[this.writePtr % this.ringSize] = sampleR;

                            if (this.counter <= 0) {
                                const captureStart = (this.writePtr - holdSamples + this.ringSize) % this.ringSize;
                                const len = Math.min(grainSamples, Math.max(1, holdSamples - 1), 48000);
                                for (let g = 0; g < len; g++) {
                                    const idx = (captureStart + g) % this.ringSize;
                                    this.grainL[g] = this.ringL[idx];
                                    this.grainR[g] = this.ringR[idx];
                                }
                                this.grainLen = len; this.grainRead = 0;
                                this.counter = holdSamples; this.captured = true;
                            }

                            if (this.divCounter <= 0) {
                                let outL = 0, outR = 0;
                                if (this.captured && this.grainLen > 0) {
                                    outL = this.grainL[this.grainRead % this.grainLen];
                                    outR = this.grainR[this.grainRead % this.grainLen];
                                    this.grainRead++;
                                }
                                const mono = (outL + outR) * 0.5;
                                let processedMono = mono;
                                if (nsOn && nsThresh > 0) {
                                    const absVal = Math.abs(processedMono);
                                    if (absVal < nsThresh * 0.5) processedMono *= 0.05;
                                    else if (absVal < nsThresh) {
                                        const r = (absVal - nsThresh * 0.5) / (nsThresh * 0.5);
                                        processedMono *= 0.05 + r * 0.9;
                                    }
                                }
                                if (aecOn) {
                                    const aecIdx = (this.aecBufPtr - this.aecDelay + this.aecBufLen) % this.aecBufLen;
                                    processedMono -= this.aecBuf[aecIdx] * 0.55;
                                    this.aecBuf[this.aecBufPtr] = processedMono;
                                    this.aecBufPtr = (this.aecBufPtr + 1) % this.aecBufLen;
                                }
                                if (ecOn) {
                                    const ecIdx = (this.ecBufPtr - this.ecDelay + this.ecBufLen) % this.ecBufLen;
                                    processedMono -= this.ecBuf[ecIdx] * 0.35;
                                    this.ecBuf[this.ecBufPtr] = processedMono;
                                    this.ecBufPtr = (this.ecBufPtr + 1) % this.ecBufLen;
                                }
                                outL = outL * (processedMono / (mono + 0.0001));
                                outR = outR * (processedMono / (mono + 0.0001));

                                const applyBitCrush = (v) => {
                                    if (bitDepthVal < 32) {
                                        const maxVal = (Math.pow(2, bitDepthVal) / 2) - 1;
                                        v = Math.round(v * maxVal) / maxVal;
                                    }
                                    return v * mult;
                                };
                                outL = applyBitCrush(outL);
                                outR = applyBitCrush(outR);

                                if (smoothing > 0) {
                                    const a = 1 - smoothing * 0.99;
                                    this.prevOutL = a * outL + (1 - a) * this.prevOutL;
                                    this.prevOutR = a * outR + (1 - a) * this.prevOutR;
                                    outL = this.prevOutL; outR = this.prevOutR;
                                }
                                if (simplifier > 0) {
                                    const skip = Math.round(1 + simplifier * 199);
                                    if (this.simplifyCounter >= skip) {
                                        this.simplifyLastL = outL; this.simplifyLastR = outR;
                                        this.simplifyCounter = 0;
                                    }
                                    outL = this.simplifyLastL; outR = this.simplifyLastR;
                                    this.simplifyCounter++;
                                }

                                if (rgbaOn && rgbaAmt > 0) {
                                    const r = outL, g = outR, b = (outL + outR) * 0.5, a = Math.abs(outL - outR);
                                    const distortedR = b;
                                    const distortedG = g * (1 + 0.5 * Math.sin(this.writePtr * 0.001));
                                    const distortedB = r;
                                    const blend = rgbaAmt;
                                    outL = r * (1 - blend) + distortedR * blend;
                                    outR = g * (1 - blend) + distortedG * blend;
                                    outL = Math.max(-1.5, Math.min(1.5, outL));
                                    outR = Math.max(-1.5, Math.min(1.5, outR));
                                }

                                this.lastOutL = outL; this.lastOutR = outR;
                                this.divCounter = divisor - 1;
                            } else {
                                this.divCounter--;
                            }

                            output[0][i] = this.lastOutL;
                            output[1][i] = this.lastOutR;
                            this.counter--;
                            this.writePtr++;
                            if (this.writePtr >= this.ringSize) this.writePtr -= this.ringSize;
                        }

                        const interleaved = new Float32Array(blockSize * 2);
                        for (let i = 0; i < blockSize; i++) {
                            interleaved[i * 2] = output[0][i];
                            interleaved[i * 2 + 1] = output[1][i];
                        }
                        this.port.postMessage({ type: 'audioData', buffer: interleaved }, [interleaved.buffer]);
                        return true;
                    }
                }
                registerProcessor('slit-scan-looper', SlitScanLooper);
            `;

            async function loadWorklet() {
                if (workletLoaded) return true;
                if (!audioCtx) return false;
                try {
                    const blob = new Blob([workletCode], { type: 'application/javascript' });
                    const url = URL.createObjectURL(blob);
                    await audioCtx.audioWorklet.addModule(url);
                    URL.revokeObjectURL(url);
                    workletLoaded = true;
                    return true;
                } catch (e) { console.error(e); return false; }
            }

            async function setupGraph() {
                if (!audioCtx) return;
                if (!(await loadWorklet())) { alert('AudioWorklet required.'); return; }
                if (workletNode) { workletNode.port.onmessage = null; workletNode.disconnect(); }
                if (analyserL) analyserL.disconnect();
                if (analyserR) analyserR.disconnect();

                analyserL = audioCtx.createAnalyser();
                analyserR = audioCtx.createAnalyser();
                analyserL.fftSize = 2048; analyserR.fftSize = 2048;
                analyserL.smoothingTimeConstant = 0.5; analyserR.smoothingTimeConstant = 0.5;

                workletNode = new AudioWorkletNode(audioCtx, 'slit-scan-looper', {
                    processorOptions: { sampleRate: audioCtx.sampleRate },
                    numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
                });
                const splitter = audioCtx.createChannelSplitter(2);
                workletNode.connect(splitter);
                splitter.connect(analyserL, 0);
                splitter.connect(analyserR, 1);
                analyserL.connect(audioCtx.destination);
                analyserR.connect(audioCtx.destination);

                visSampleRate = audioCtx.sampleRate;
                bufferCapacity = Math.ceil(visSampleRate * MAX_BUFFER_SEC);
                visBufferL = new Float32Array(bufferCapacity);
                visBufferR = new Float32Array(bufferCapacity);
                visWriteIdx = 0;

                workletNode.port.onmessage = (event) => {
                    if (event.data.type === 'audioData') {
                        const chunk = event.data.buffer;
                        for (let i = 0; i < chunk.length; i += 2) {
                            const idx = (visWriteIdx + i/2) % bufferCapacity;
                            visBufferL[idx] = chunk[i];
                            visBufferR[idx] = chunk[i+1];
                        }
                        visWriteIdx += chunk.length / 2;
                        if (recording) recordedChunks.push(new Float32Array(chunk));
                    }
                };
                updateAllParams();
            }

            function updateAllParams() {
                if (!workletNode || !audioCtx) return;
                const sr = audioCtx.sampleRate;
                const p = workletNode.parameters;
                p.get('holdSamples').value = Math.round(delayMs / 1000 * sr);
                p.get('grainSamples').value = Math.round(bufferMs / 1000 * sr);
                p.get('aecActive').value = aecOn ? 1 : 0;
                p.get('ecActive').value = ecOn ? 1 : 0;
                p.get('nsActive').value = nsOn ? 1 : 0;
                p.get('nsThreshold').value = nsThreshPct / 100;
                p.get('divisor').value = divisorValParam;
                p.get('multiplier').value = multiplierValParam;
                p.get('bitDepth').value = bitDepth;
                p.get('smoothing').value = smoothPct / 100;
                p.get('simplifier').value = simplifyPct / 100;
                p.get('rgbaDistortOn').value = rgbaDistortOn ? 1 : 0;
                p.get('rgbaDistortAmt').value = rgbaDistortAmt / 100;
            }

            function connectSource(node) {
                if (!workletNode) return;
                if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} }
                sourceNode = node;
                // Simply connect to worklet (stereo input is accepted)
                node.connect(workletNode);
            }

            function stopSource() {
                if (sourceNode) { try { sourceNode.stop(); sourceNode.disconnect(); } catch(e) {} }
                sourceNode = null;
                if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
                isPlaying = false; updateStartBtn();
            }

            function updateStartBtn() {
                startBtn.textContent = isPlaying ? '⏹ stop' : '▶ start';
                if (isPlaying) startBtn.classList.add('red'); else startBtn.classList.remove('red');
            }

            async function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    await setupGraph();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();
            }

            async function startSweep() {
                await initAudio(); stopSource();
                if (!sweepBuffer) {
                    const offline = new OfflineAudioContext(2, 44100 * 5, 44100);
                    const osc = offline.createOscillator();
                    const gain = offline.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, 0);
                    osc.frequency.exponentialRampToValueAtTime(4000, 4.5);
                    gain.gain.setValueAtTime(0.5, 0);
                    gain.gain.linearRampToValueAtTime(0, 5);
                    osc.connect(gain);
                    gain.connect(offline.destination);
                    osc.start(0); osc.stop(5);
                    sweepBuffer = await offline.startRendering();
                }
                const bs = audioCtx.createBufferSource();
                bs.buffer = sweepBuffer; bs.loop = true;
                connectSource(bs); bs.start();
                isPlaying = true; updateStartBtn();
            }

            async function startFile(file) {
                await initAudio(); stopSource();
                const arrayBuf = await file.arrayBuffer();
                const audioBuf = await audioCtx.decodeAudioData(arrayBuf);
                const bs = audioCtx.createBufferSource();
                bs.buffer = audioBuf; bs.loop = true;
                connectSource(bs); bs.start();
                isPlaying = true; updateStartBtn();
                fileBtn.textContent = '📁 ' + file.name.slice(0, 18);
            }

            async function startMic() {
                await initAudio(); stopSource();
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const micNode = audioCtx.createMediaStreamSource(micStream);
                    connectSource(micNode);
                    isPlaying = true; updateStartBtn();
                } catch (e) { alert('Mic error: ' + e.message); }
            }

            function toggleRecording() {
                if (!isPlaying) return;
                recording = !recording;
                recordBtn.innerHTML = recording ? '<span class="record-icon"></span> stop rec' : '<span class="record-icon"></span> rec';
                if (recording) recordedChunks = [];
                else exportWAV();
            }

            function exportWAV() {
                if (recordedChunks.length === 0) return;
                let totalLen = 0;
                recordedChunks.forEach(c => totalLen += c.length);
                const interleaved = new Float32Array(totalLen);
                let offset = 0;
                recordedChunks.forEach(c => { interleaved.set(c, offset); offset += c.length; });
                const sampleRate = audioCtx.sampleRate;
                const numChannels = 2, bitsPerSample = 16;
                const dataLength = interleaved.length * 2;
                const buffer = new ArrayBuffer(44 + dataLength);
                const view = new DataView(buffer);
                const wstr = (off, str) => { for (let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i)); };
                wstr(0, 'RIFF'); view.setUint32(4, 36+dataLength, true); wstr(8, 'WAVE');
                wstr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
                view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * bitsPerSample/8, true);
                view.setUint16(32, numChannels * bitsPerSample/8, true); view.setUint16(34, bitsPerSample, true);
                wstr(36, 'data'); view.setUint32(40, dataLength, true);
                let off = 44;
                for (let i = 0; i < interleaved.length; i++) {
                    const s = Math.max(-1, Math.min(1, interleaved[i]));
                    const val = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    view.setInt16(off, val, true); off += 2;
                }
                const blob = new Blob([view], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'slitscan-stereo.wav'; a.click();
                URL.revokeObjectURL(url);
            }

            function draw() {
                const w = visCanvas.width, h = visCanvas.height;
                ctx.clearRect(0, 0, w, h);
                if (!isPlaying || visWriteIdx === 0) {
                    ctx.fillStyle = '#222'; ctx.font = '11px Inter, sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText('start audio to see waveform', w/2, h/2);
                    return;
                }

                if (displayMode === 'diagram') {
                    if (visWriteIdx < h) return;
                    const imageData = ctx.getImageData(1, 0, w-1, h);
                    ctx.putImageData(imageData, 0, 0);
                    const colData = ctx.createImageData(1, h);
                    const startIdx = (visWriteIdx - h + bufferCapacity) % bufferCapacity;
                    for (let y = 0; y < h; y++) {
                        const sample = visBufferL[(startIdx + y) % bufferCapacity];
                        const brightness = Math.floor(Math.max(0, Math.min(255, (sample * 0.5 + 0.5) * 255)));
                        const idx = (h - 1 - y) * 4;
                        colData.data[idx] = brightness;
                        colData.data[idx+1] = brightness;
                        colData.data[idx+2] = brightness;
                        colData.data[idx+3] = 255;
                    }
                    ctx.putImageData(colData, w-1, 0);
                    return;
                }

                if (displayMode === 'fft') {
                    if (!analyserL) return;
                    const freqL = new Uint8Array(analyserL.frequencyBinCount);
                    analyserL.getByteFrequencyData(freqL);
                    const freqR = stereoVis ? new Uint8Array(analyserR.frequencyBinCount) : null;
                    if (stereoVis) analyserR.getByteFrequencyData(freqR);
                    const barW = w / freqL.length;
                    for (let i = 0; i < freqL.length; i++) {
                        const bhL = (freqL[i]/255) * h;
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(i * barW, h - bhL, barW - 1, bhL);
                        if (stereoVis && freqR) {
                            const bhR = (freqR[i]/255) * h;
                            ctx.fillStyle = '#0ff';
                            ctx.fillRect(i * barW + barW/2, h - bhR, barW/2 - 1, bhR);
                        }
                    }
                    return;
                }

                const windowSamples = Math.round(zoomMs / 1000 * visSampleRate);
                const totalAvail = Math.min(visWriteIdx, bufferCapacity);
                const startIdx = Math.max(0, visWriteIdx - windowSamples) % bufferCapacity;
                const samplesToDraw = Math.min(windowSamples, totalAvail);
                const dataL = [], dataR = [];
                for (let i = 0; i < samplesToDraw; i++) {
                    const idx = (startIdx + i) % bufferCapacity;
                    dataL.push(visBufferL[idx]);
                    dataR.push(visBufferR[idx]);
                }
                if (dataL.length < 2) return;
                const stepX = w / (dataL.length - 1);
                const midH = h / 2;

                if (displayMode === 'bars' || displayMode === 'combined') {
                    if (analyserL) {
                        const freq = new Uint8Array(analyserL.frequencyBinCount);
                        analyserL.getByteFrequencyData(freq);
                        const barCount = Math.min(barsCount, freq.length);
                        const barW = w / barCount;
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        for (let i = 0; i < barCount; i++) {
                            const mag = freq[Math.floor(i * freq.length / barCount)] / 255;
                            ctx.fillRect(i * barW, h - mag*h*0.7, barW-1, mag*h*0.7);
                        }
                    }
                }

                const drawChannel = (data, color) => {
                    if (displayMode === 'wave' || displayMode === 'combined') {
                        ctx.strokeStyle = color; ctx.lineWidth = 1.5;
                        ctx.shadowColor = color; ctx.shadowBlur = 4;
                        ctx.beginPath();
                        for (let i = 0; i < data.length; i++) {
                            const y = midH - data[i] * (midH * 0.9);
                            const px = i * stepX;
                            i === 0 ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
                        }
                        ctx.stroke(); ctx.shadowBlur = 0;
                    }
                    if (displayMode === 'points' || displayMode === 'combined') {
                        ctx.fillStyle = color;
                        let lastVal = null;
                        for (let i = 0; i < data.length; i++) {
                            const y = midH - data[i] * (midH * 0.9);
                            const px = i * stepX;
                            if (lastVal === null || Math.abs(data[i] - lastVal) > ptsDelta) {
                                ctx.fillRect(px-1, y-1, 2, 2);
                                lastVal = data[i];
                            }
                        }
                    }
                };

                if (stereoVis) {
                    drawChannel(dataL, '#fff');
                    drawChannel(dataR, '#0ff');
                } else {
                    drawChannel(dataL, '#fff');
                }
            }

            function animLoop() { draw(); requestAnimationFrame(animLoop); }

            function bindControl(slider, numInput, valueSpan, getVal, setVal, fineStep=1, coarseStep=10, formatVal=v=>v+'') {
                slider.addEventListener('input', () => setVal(parseFloat(slider.value)));
                numInput.addEventListener('input', () => { let v = parseFloat(numInput.value); if (!isNaN(v)) setVal(v); });
                numInput.addEventListener('change', () => {
                    let v = parseFloat(numInput.value);
                    if (isNaN(v)) v = parseFloat(slider.min);
                    setVal(Math.min(parseFloat(slider.max), Math.max(parseFloat(slider.min), v)));
                });
                const inc = (factor) => setVal(Math.min(parseFloat(slider.max), Math.max(parseFloat(slider.min), getVal()+factor)));
                const fineDec = document.querySelector(`.${slider.id.replace('Slider','')}-fine-dec`);
                const fineInc = document.querySelector(`.${slider.id.replace('Slider','')}-fine-inc`);
                const coarseDec = document.querySelector(`.${slider.id.replace('Slider','')}-coarse-dec`);
                const coarseInc = document.querySelector(`.${slider.id.replace('Slider','')}-coarse-inc`);
                if (fineDec) fineDec.addEventListener('click', ()=>inc(-fineStep));
                if (fineInc) fineInc.addEventListener('click', ()=>inc(fineStep));
                if (coarseDec) coarseDec.addEventListener('click', ()=>inc(-coarseStep));
                if (coarseInc) coarseInc.addEventListener('click', ()=>inc(coarseStep));
                return function refresh() { const v = getVal(); slider.value = v; numInput.value = v; valueSpan.textContent = formatVal(v); };
            }

            const refreshDelay = bindControl(delaySlider, delayNum, delayVal, ()=>delayMs, v=>{ delayMs=v; if(bufferMs>=delayMs){ bufferMs=Math.max(0.02,delayMs-0.01); refreshBuffer(); } bufferSlider.max=delayMs-0.01; bufferNum.max=delayMs-0.01; refreshAll(); }, 0.1,10, v=>v.toFixed(1)+' ms');
            const refreshBuffer = bindControl(bufferSlider, bufferNum, bufferVal, ()=>bufferMs, v=>{ bufferMs=Math.min(delayMs-0.01, v); refreshAll(); }, 0.1,10, v=>v.toFixed(1)+' ms');
            const refreshDivisor = bindControl(divisorSlider, divisorNum, divisorVal, ()=>divisorValParam, v=>{ divisorValParam=Math.round(v); refreshAll(); }, 1,5, v=>v);
            const refreshMultiplier = bindControl(multiplierSlider, multiplierNum, multiplierVal, ()=>multiplierValParam, v=>{ multiplierValParam=v; refreshAll(); }, 0.01,0.5, v=>v.toFixed(2));
            const refreshBit = bindControl(bitSlider, bitNum, bitVal, ()=>bitDepth, v=>{ bitDepth=Math.round(v); refreshAll(); }, 1,4, v=>v+' bit');
            const refreshSmooth = bindControl(smoothSlider, smoothNum, smoothVal, ()=>smoothPct, v=>{ smoothPct=Math.round(v); refreshAll(); }, 1,10, v=>v+'%');
            const refreshSimplify = bindControl(simplifySlider, simplifyNum, simplifyVal, ()=>simplifyPct, v=>{ simplifyPct=Math.round(v); refreshAll(); }, 1,10, v=>v+'%');
            const refreshZoom = bindControl(zoomSlider, zoomNum, zoomVal, ()=>zoomMs, v=>{ zoomMs=v; }, 0.1,100, v=>v.toFixed(1)+' ms');
            const refreshPtsDelta = bindControl(ptsDeltaSlider, ptsDeltaNum, ptsDeltaVal, ()=>ptsDelta, v=>{ ptsDelta=v; }, 0.001,0.01, v=>v.toFixed(3));
            const refreshBars = bindControl(barsSlider, barsNum, barsVal, ()=>barsCount, v=>{ barsCount=Math.round(v); }, 1,8, v=>v);

            function refreshAll() {
                updateAllParams();
                refreshDelay(); refreshBuffer(); refreshDivisor(); refreshMultiplier();
                refreshBit(); refreshSmooth(); refreshSimplify(); refreshZoom(); refreshPtsDelta(); refreshBars();
            }

            nsThreshSlider.addEventListener('input', ()=>{ nsThreshPct=parseInt(nsThreshSlider.value); nsThreshVal.textContent=nsThreshPct+'%'; updateAllParams(); });
            rgbaDistortSlider.addEventListener('input', ()=>{ rgbaDistortAmt=parseInt(rgbaDistortSlider.value); rgbaDistortVal.textContent=rgbaDistortAmt+'%'; updateAllParams(); });
            aecCheck.addEventListener('change', ()=>{ aecOn=aecCheck.checked; updateAllParams(); });
            ecCheck.addEventListener('change', ()=>{ ecOn=ecCheck.checked; updateAllParams(); });
            nsCheck.addEventListener('change', ()=>{ nsOn=nsCheck.checked; updateAllParams(); });
            rgbaDistortCheck.addEventListener('change', ()=>{ rgbaDistortOn=rgbaDistortCheck.checked; updateAllParams(); });
            stereoVisCheck.addEventListener('change', ()=>{ stereoVis=stereoVisCheck.checked; });

            modeBtns.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('click', ()=>{
                    modeBtns.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    displayMode = btn.dataset.mode;
                    barsRow.style.display = (displayMode==='bars'||displayMode==='combined') ? 'flex' : 'none';
                });
            });
            barsRow.style.display='none';

            startBtn.addEventListener('click', async ()=>{ await initAudio(); if(!isPlaying) await startSweep(); else stopSource(); });
            sweepBtn.addEventListener('click', startSweep);
            micBtn.addEventListener('click', startMic);
            fileBtn.addEventListener('click', ()=>fileInput.click());
            fileInput.addEventListener('change', e=>{ if(e.target.files[0]) startFile(e.target.files[0]); });
            recordBtn.addEventListener('click', toggleRecording);

            document.addEventListener('dragover', e=>e.preventDefault());
            document.addEventListener('drop', e=>{ e.preventDefault(); const file = e.dataTransfer.files[0]; if(file&&file.type.startsWith('audio/')) startFile(file); });

            document.addEventListener('keydown', e=>{
                if(e.target.tagName==='INPUT' && (e.target.type==='range'||e.target.type==='number')) return;
                switch(e.key.toLowerCase()){
                    case ' ': e.preventDefault(); startBtn.click(); break;
                    case 's': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); startSweep(); } break;
                    case 'm': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); startMic(); } break;
                    case 'f': if(!e.ctrlKey&&!e.metaKey){ e.preventDefault(); fileInput.click(); } break;
                }
            });

            function initUI() {
                bufferSlider.max = delayMs - 0.01;
                bufferNum.max = delayMs - 0.01;
                refreshAll();
                animLoop();
            }
            initUI();
        })();
    </script>
</body>
</html>
